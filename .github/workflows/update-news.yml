name: Update TW Stock News Dashboard V3

on:
  schedule:
    # 台灣時間 08:05 = UTC 00:05
    - cron: "5 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch news and rebuild dashboard
        run: python fetch_news.py --days 2 --max 12

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news_auto_data.json tw_stock_news_dashboard_v3.html
          git commit -m "Update TW stock news dashboard v3" || echo "No changes"
          git push
