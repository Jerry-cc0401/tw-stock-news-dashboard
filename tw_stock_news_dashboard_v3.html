let activeTopic = "all";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function settings(){return REPORT.settings || {}}
function holdings(){return settings().my_holdings || {}}
function watchlist(){return settings().watchlist || {}}
function stockName(code){return holdings()[code] || watchlist()[code] || ""}
function pill(code){
  const cls = holdings()[code] ? "holding" : (watchlist()[code] ? "watch" : "");
  return `<span class="pill ${cls}">${esc(code)} ${esc(stockName(code))}</span>`;
}
function gradePill(g){
  let cls = g && g.indexOf("A")===0 ? "gradeA" : (g && g.indexOf("B")===0 ? "gradeB" : "gradeC");
  return `<span class="pill ${cls}">${esc(g||"C_參考")}</span>`;
}
function heatBar(v){ return `<div class="heatbar"><div style="width:${Math.max(0,Math.min(100,v||0))}%"></div></div>`; }
function q(){return document.getElementById("q").value.trim().toLowerCase()}
function itemText(it){return [it.title,it.description,it.event,it.view,it.source,it.topic_name,(it.stocks||[]).join(" ")].join(" ").toLowerCase()}
function matchQ(it){const query=q(); return !query || itemText(it).includes(query)}
function topicMatch(t){const query=q(); return !query || [t.name,t.description,t.topic_view,(t.core_stocks||[]).join(" ")].join(" ").toLowerCase().includes(query) || (t.items||[]).some(matchQ)}
function renderSidebar(){
  document.getElementById("holdings").innerHTML = Object.keys(holdings()).map(pill).join("");
  document.getElementById("watchlist").innerHTML = Object.keys(watchlist()).map(pill).join("");
  const topics=[{id:"all",name:"全部題材"},{id:"focus",name:"焦點大事"},{id:"stocks",name:"持股影響表"},...(REPORT.topics||[]).filter(t=>t.id!=="focus")];
  document.getElementById("topicNav").innerHTML = topics.map(t=>`<button class="topicbtn ${activeTopic===t.id?'active':''}" onclick="activeTopic='${esc(t.id)}';render()">${esc(t.name)}</button>`).join("");
}
function renderOverview(){
  const b = REPORT.market_bias || {};
  let cls = b.label && b.label.indexOf("偏多")>=0 ? "pos" : (b.label && b.label.indexOf("偏空")>=0 ? "neg" : "neu");
  const articleCount = (REPORT.topics||[]).reduce((sum,t)=>sum+(t.items||[]).length,0);
  document.getElementById("generatedAt").textContent = `分析日期與時間：${REPORT.generated_at || ""}`;
  document.getElementById("overview").innerHTML = `
    <div class="hero">
      <div class="summary">
        <div class="small">今日焦點結論</div>
        <div class="bias ${cls}">${esc(b.label || "尚無結論")}</div>
        <div>${esc(b.reason || "")}</div>
      </div>
      <div class="warn">
        <strong>市場數據提醒</strong><br>
        ${esc((REPORT.market_note||{}).event||"")}<br>
        ${esc((REPORT.market_note||{}).view||"")}
      </div>
    </div>
    <div class="kpi">
      <div class="kpicard"><span class="small">平均題材熱度</span><strong>${esc(b.average_topic_heat ?? "-")}</strong></div>
      <div class="kpicard"><span class="small">正向訊號</span><strong>${esc(b.positive_signals ?? "-")}</strong></div>
      <div class="kpicard"><span class="small">負向訊號</span><strong>${esc(b.negative_signals ?? "-")}</strong></div>
      <div class="kpicard"><span class="small">新聞筆數</span><strong>${articleCount}</strong></div>
    </div>
  `;
}
function renderStrategy(){
  const s = REPORT.strategy || {};
  document.getElementById("strategy").innerHTML = `
    <div class="sectiontitle"><h2>盤前操作提醒</h2><span class="small">不是買賣建議，是觀察順序</span></div>
    <div class="summary"><strong>${esc(s.action || "")}</strong><br>${esc(s.note || "")}</div>
    <div class="grid2" style="margin-top:12px">
      <div class="kpicard">
        <strong>優先觀察題材</strong>
        <ul>${(s.top_topics||[]).map(t=>`<li>${esc(t.name)}：${esc(t.heat_score)} 分<br><span class="small">${esc(t.view)}</span></li>`).join("") || "<li>尚無</li>"}</ul>
      </div>
      <div class="kpicard">
        <strong>今日風險題材</strong>
        <ul>${(s.risk_topics||[]).map(t=>`<li>${esc(t.name)}：${esc((t.risk_flags||[]).join("、")||"無明顯風險詞")}</li>`).join("") || "<li>尚無</li>"}</ul>
      </div>
    </div>
  `;
}
function renderStockImpact(){
  const rows=(REPORT.stock_impacts||[]).filter(s=>{
    const query=q();
    return !query || [s.code,s.name,s.type,s.impact,(s.related_topics||[]).join(" "),s.watch_point].join(" ").toLowerCase().includes(query)
  });
  document.getElementById("stockImpact").innerHTML = `
    <div class="sectiontitle"><h2>你的持股／關注股影響表</h2><span class="small">依題材熱度與新聞關聯自動估算</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>股票</th><th>類型</th><th>影響</th><th>分數</th><th>關聯題材</th><th>觀察重點</th><th>風險</th></tr></thead>
      <tbody>${rows.map(s=>`
        <tr>
          <td>${pill(s.code)}</td>
          <td>${esc(s.type)}</td>
          <td><strong>${esc(s.impact)}</strong></td>
          <td>${heatBar(s.impact_score)}<span class="small">${esc(s.impact_score)}</span></td>
          <td>${esc((s.related_topics||[]).join("、") || "-")}</td>
          <td>${esc(s.watch_point || "")}</td>
          <td>${esc((s.risk_flags||[]).join("、") || "-")}</td>
        </tr>`).join("")}</tbody>
    </table></div>
  `;
}
function renderTopicHeat(){
  let topics=(REPORT.topics||[]).filter(t=>t.id!=="focus").filter(topicMatch).sort((a,b)=>(b.heat_score||0)-(a.heat_score||0));
  document.getElementById("topicHeat").innerHTML = `
    <div class="sectiontitle"><h2>題材熱度排行</h2><span class="small">0～100 分，依新聞量、關鍵字、正負訊號估算</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>題材</th><th>熱度</th><th>正／負</th><th>核心關聯股</th><th>觀點</th><th>風險詞</th></tr></thead>
      <tbody>${topics.map(t=>`
        <tr>
          <td><strong>${esc(t.name)}</strong><br><span class="small">${esc(t.description||"")}</span></td>
          <td>${heatBar(t.heat_score)}<span class="small">${esc(t.heat_score)}</span></td>
          <td>${esc(t.positive_count||0)}／${esc(t.negative_count||0)}</td>
          <td><div class="pillrow">${(t.core_stocks||[]).map(pill).join("") || "-"}</div></td>
          <td>${esc(t.topic_view||"")}</td>
          <td>${esc((t.risk_flags||[]).join("、") || "-")}</td>
        </tr>`).join("")}</tbody>
    </table></div>
  `;
}
function renderItem(it, focus=false){
  return `<article class="newsitem ${focus?'focus':''}">
    <h3>${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title||it.event)}</a>` : esc(it.title||it.event)}</h3>
    <div class="meta">
      <span>${esc(it.source||"")}</span>
      <span>${esc((it.published||"").replace("T"," ").slice(0,16))}</span>
      ${gradePill(it.source_grade)}
      ${(it.matched_topics||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join("")}
    </div>
    <p><strong>事件：</strong>${esc(it.event||it.title||"")}</p>
    <p><strong>觀點：</strong>${esc(it.view||"")}</p>
    <div class="pillrow">${(it.stocks||[]).map(pill).join("")}</div>
  </article>`;
}
function renderFocus(){
  const items=(REPORT.focus||[]).filter(matchQ);
  document.getElementById("focus").innerHTML = `
    <div class="sectiontitle"><h2>焦點大事</h2><span class="small">影響整體盤勢的大事件</span></div>
    ${items.length ? items.map(it=>renderItem(it,true)).join("") : "<p class='small'>沒有符合搜尋條件的焦點新聞。</p>"}
  `;
}
function renderTopicDetail(){
  if(activeTopic==="stocks"){
    document.getElementById("topicDetail").innerHTML = `<p class="small">目前顯示持股影響表。請點左側題材查看分類新聞。</p>`;
    return;
  }
  if(activeTopic==="focus"){
    document.getElementById("topicDetail").innerHTML = `<p class="small">目前顯示焦點大事。請點左側題材查看分類新聞。</p>`;
    return;
  }
  let topics=(REPORT.topics||[]).filter(t=>t.id!=="focus");
  if(activeTopic!=="all") topics=topics.filter(t=>t.id===activeTopic);
  topics=topics.filter(topicMatch);
  document.getElementById("topicDetail").innerHTML = topics.map(t=>{
    const items=(t.items||[]).filter(matchQ);
    return `<section style="margin-bottom:18px">
      <div class="sectiontitle">
        <div><h2>${esc(t.name)}</h2><div class="small">${esc(t.description||"")}</div></div>
        <span class="pill">${items.length} 則｜熱度 ${esc(t.heat_score)}</span>
      </div>
      ${items.length ? items.map(it=>renderItem(it)).join("") : "<p class='small'>沒有符合搜尋條件的新聞。</p>"}
    </section>`;
  }).join("") || "<p class='small'>沒有題材資料。</p>";
}
function toggleRaw(){
  const box=document.getElementById("rawBox");
  box.classList.toggle("hidden");
  document.getElementById("raw").textContent=JSON.stringify(REPORT,null,2);
}

  renderSidebar();
  renderOverview();
  renderStrategy();
  renderStockImpact();
  renderTopicHeat();
  renderFocus();
  renderTopicDetail();
}
