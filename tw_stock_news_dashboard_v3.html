button{border:0;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}

input,select{width:100%;background:#fff;color:var(--text)}

.pill.gradeB{background:var(--blue2);color:#1d3fa3;border-color:#84adff}
.pill.gradeC{background:#f2f4f7;color:#475467}
.small{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.summary{background:linear-gradient(135deg,#f8fbff,#eef4ff);border:1px solid #dbe7ff;border-radius:16px;padding:14px}
.bias{font-size:28px;font-weight:800;margin:4px 0}
.bias.pos{color:var(--green)}.bias.neu{color:var(--amber)}.bias.neg{color:var(--red)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media(max-width:760px){.kpi{grid-template-columns:1fr 1fr}}
.kpicard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.kpicard strong{display:block;font-size:18px}
.sectiontitle{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.sectiontitle h2{margin:0;font-size:22px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;font-size:14px}
th{background:#f8fafc;color:#344054;white-space:nowrap}
.heatbar{height:9px;background:#eef2f6;border-radius:99px;overflow:hidden;min-width:90px}
.heatbar>div{height:100%;background:linear-gradient(90deg,#84adff,#2952cc);border-radius:99px}
.newsitem{border-left:4px solid #84adff;background:#fbfcff;border-radius:0 14px 14px 0;padding:12px 14px;margin:10px 0}
.newsitem.focus{border-left-color:#f79009;background:#fffcf5}
.newsitem h3{margin:0 0 6px;font-size:17px}
.newsitem p{margin:6px 0}
a{color:#1d4ed8;text-decoration:none}
a:hover{text-decoration:underline}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.warn{background:var(--amber2);border:1px solid #fed7aa;color:#7a2e0e;border-radius:14px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.hidden{display:none}
pre{white-space:pre-wrap;background:#101828;color:#fff;border-radius:14px;padding:12px;overflow:auto;font-size:12px}
.footer{color:var(--muted);font-size:12px;padding:0 18px 20px}
@media print{aside,.actions{display:none!important}.layout{display:block}.panel{box-shadow:none}.newsitem,table{break-inside:avoid}}

let activeTopic = "all";

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function settings(){return REPORT.settings || {}}
function holdings(){return settings().my_holdings || {}}
function watchlist(){return settings().watchlist || {}}
function stockName(code){return holdings()[code] || watchlist()[code] || ""}
function pill(code){
  const cls = holdings()[code] ? "holding" : (watchlist()[code] ? "watch" : "");
  return `<span class="pill ${cls}">${esc(code)} ${esc(stockName(code))}</span>`;
}
function gradePill(g){
  let cls = g && g.indexOf("A")===0 ? "gradeA" : (g && g.indexOf("B")===0 ? "gradeB" : "gradeC");
  return `<span class="pill ${cls}">${esc(g||"C_參考")}</span>`;
}
function heatBar(v){ return `<div class="heatbar"><div style="width:${Math.max(0,Math.min(100,v||0))}%"></div></div>`; }
function q(){return document.getElementById("q").value.trim().toLowerCase()}
function itemText(it){return [it.title,it.description,it.event,it.view,it.source,it.topic_name,(it.stocks||[]).join(" ")].join(" ").toLowerCase()}
function matchQ(it){const query=q(); return !query || itemText(it).includes(query)}
function topicMatch(t){const query=q(); return !query || [t.name,t.description,t.topic_view,(t.core_stocks||[]).join(" ")].join(" ").toLowerCase().includes(query) || (t.items||[]).some(matchQ)}
function renderSidebar(){
  document.getElementById("holdings").innerHTML = Object.keys(holdings()).map(pill).join("");
  document.getElementById("watchlist").innerHTML = Object.keys(watchlist()).map(pill).join("");
  const topics=[{id:"all",name:"全部題材"},{id:"focus",name:"焦點大事"},{id:"stocks",name:"持股影響表"},...(REPORT.topics||[]).filter(t=>t.id!=="focus")];
  document.getElementById("topicNav").innerHTML = topics.map(t=>`<button class="topicbtn ${activeTopic===t.id?'active':''}" onclick="activeTopic='${esc(t.id)}';render()">${esc(t.name)}</button>`).join("");
}

        <div><h2>${esc(t.name)}</h2><div class="small">${esc(t.description||"")}</div></div>
        <span class="pill">${items.length} 則｜熱度 ${esc(t.heat_score)}</span>
      </div>
      ${items.length ? items.map(it=>renderItem(it)).join("") : "<p class='small'>沒有符合搜尋條件的新聞。</p>"}
    </section>`;
  }).join("") || "<p class='small'>沒有題材資料。</p>";
}
function toggleRaw(){
  const box=document.getElementById("rawBox");
  box.classList.toggle("hidden");
  document.getElementById("raw").textContent=JSON.stringify(REPORT,null,2);
}
function render(){
  renderSidebar();
  renderOverview();
  renderStrategy();
  renderStockImpact();
  renderTopicHeat();
  renderFocus();
  renderTopicDetail();
}
render();
</script>
</body>
</html>
